name = "sutura-research"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://suturaworks.com,https://www.suturaworks.com"
NOTIFY_TO = "socials@suturaworks.com"
NOTIFY_FROM = "Sutura Works Limited Research <research@suturaworks.com>"

[[d1_databases]]
binding = "DB"
database_name = "sutura-research"
database_id = "7c9d45a0-3f1c-4bd4-8168-fb4c7f1829bd"

# Secrets (set with `wrangler secret put`, never stored in this file):
#   EXPORT_KEY      long random key that protects the CSV download links
#   RESEND_API_KEY  optional; enables the "new response" email to NOTIFY_TO
