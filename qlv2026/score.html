<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0F2B63">
<title>QLV 2026 scoring</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="p2.css">
<style>
body { padding-bottom: 96px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 2px; scrollbar-width: none; }
.chip { font-family: var(--text); font-size: 13px; font-weight: 700; padding: 8px 11px; min-height: 40px; border-radius: 8px; white-space: nowrap; border: 0; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; }
.chip.on { background: var(--yel); color: var(--navy); }
.chip.advised { background: transparent; color: #CFE0F3; border: 1px dashed rgba(207,224,243,.6); cursor: not-allowed; }
.chip.waiting { color: rgba(255,255,255,.55); }
.chip.done::after { content: " ✓"; }
fieldset { border: 1px solid var(--line); background: #fff; border-radius: 12px; margin: 0 0 10px; padding: 12px 12px 14px; }
legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.crit { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--navy); margin: 0 0 8px; display: block; }
.opts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.opts button { font-family: var(--display); font-size: 18px; font-weight: 600; min-height: 48px; border-radius: 10px; cursor: pointer; background: #fff; color: var(--navy); border: 1px solid #8FA3BF; }
.opts button[aria-pressed="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
.opts button:disabled { cursor: default; }
.hint { font-size: 14px; line-height: 1.45; color: var(--body); margin: 8px 0 0; min-height: 20px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); z-index: 5; }
.bar-in { max-width: 760px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.total span { display: block; font-size: 12px; color: var(--body); }
.total b { font-family: var(--display); font-size: 26px; color: var(--navy); }
.total small { font-size: 13px; color: var(--body); font-weight: 500; }
.submit { font-family: var(--display); font-size: 16px; font-weight: 600; padding: 12px 18px; min-height: 52px; border-radius: 10px; border: 0; background: #E3EBF4; color: var(--body); }
.submit.ready { background: var(--yel); color: var(--navy); cursor: pointer; }
.submit.locked { background: #E2F2F2; color: #19646D; }
.net { font-size: 13px; font-weight: 700; border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; }
.net.wait { background: #FFF3CF; color: #6B5A1E; }
.net.ok { background: #E2F2F2; color: #19646D; }
.info { color: var(--body); text-align: center; padding: 26px 16px; }
</style>
</head>
<body>
<header class="band"><div class="band-in">
  <div class="logos"><div class="l"><img src="assets/jci-aso-white.png" alt="JCI Aso"><span class="rule"></span><img src="assets/qlv-white.png" alt="Quality Leadership Value"></div><span class="ref" id="ref"></span></div>
  <div><div class="who" id="who">Judge</div><h1 id="title">Scoring</h1></div>
  <div class="chips" id="chips" role="group" aria-label="Teams"></div>
</div></header>
<main id="main"><div class="card">Loading…</div></main>
<div class="bar" id="bar" hidden><div class="bar-in">
  <div class="total"><span>Total</span><b id="total">0</b> <small>/ 25</small></div>
  <button type="button" class="submit" id="submit" disabled>Score all five</button>
</div></div>
<script type="module" src="score.js"></script>
</body>
</html>
